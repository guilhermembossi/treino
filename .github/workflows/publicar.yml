# Endereço antigo (https://guilhermembossi.github.io/treino/): desde a tarefa 8.1 (27/10/2026) só publica
# uma página avisando o endereço novo (marca.endereco) e desliga o service worker do app antigo.
# O app é publicado pelo Cloudflare Pages (https://treino-gb.pages.dev/), pela integração com o GitHub.
name: Aviso do endereço antigo

on:
  push:
    branches: [main]
    paths: [src/config/marca.ts, scripts/gerar_aviso.mjs, .github/workflows/publicar.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/gerar_aviso.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: aviso

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
